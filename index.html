<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TiendaYa</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#17202e;--mut:#5f6b7d;--line:#dde3ec;--pri:#2457f5;--onpri:#fff;--tag:#ff6b2c;--ok:#12805c;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10141c;--card:#192030;--ink:#eef2f8;--mut:#9aa6b8;--line:#2b3548;--pri:#6f93ff;--onpri:#0b1020;--tag:#ff8a57;--ok:#4cc79a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.45;padding-top:env(safe-area-inset-top,0px)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center}
.logo{font-weight:800;font-size:19px}.logo b{color:var(--tag)}
header input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:10px 14px;font:inherit;font-size:15px}
button{font:inherit;cursor:pointer}
.ic{border:0;background:var(--pri);color:var(--onpri);border-radius:999px;padding:9px 14px;font-weight:600}
.ic span{background:var(--tag);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px;margin-left:6px}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 4px}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;white-space:nowrap;font-size:14px}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:980px;margin:0 auto;padding:10px 14px 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.p .im{aspect-ratio:1;display:grid;place-items:center;font-size:54px;background:var(--bg)}
.p .in{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.p h3{margin:0;font-size:14px;font-weight:600}
.pr{font-weight:800;color:var(--tag);font-size:16px}
.p small{color:var(--mut)}
.add{margin-top:auto;border:1px solid var(--pri);background:transparent;color:var(--pri);border-radius:10px;padding:8px;font-weight:600}
.panel{position:fixed;inset:0;z-index:20;background:rgba(10,14,22,.55);display:none;justify-content:flex-end}
.panel.open{display:flex}
.sheet{background:var(--card);width:min(440px,100%);height:100%;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 10px;font-size:20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.q{display:flex;gap:8px;align-items:center}
.q button{border:1px solid var(--line);background:var(--bg);color:var(--ink);width:28px;height:28px;border-radius:8px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.sheet input,.sheet select,.sheet textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-size:15px}
.big{width:100%;margin-top:14px;border:0;background:var(--pri);color:var(--onpri);border-radius:12px;padding:13px;font-weight:800;font-size:16px}
.big:disabled{opacity:.6}
.lnk{border:0;background:none;color:var(--mut);text-decoration:underline;padding:10px 0}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;padding:12px 0}
.note{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:13px;color:var(--mut);margin-top:12px}
.ok{color:var(--ok);font-weight:800}.err{color:var(--tag);font-size:13px;margin-top:8px}
.ord{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.ord select{margin-top:6px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:0 14px 24px}
</style>
</head>
<body>
<header>
  <div class="logo">Tienda<b>Ya</b></div>
  <input id="q" type="search" placeholder="Buscar productos" aria-label="Buscar productos">
  <button class="ic" id="bc">Carrito<span id="n">0</span></button>
</header>
<nav id="cats"></nav>
<main>
  <div class="grid" id="grid"></div>
  <div id="empty" class="note" style="display:none">No hay productos con esa búsqueda.</div>
</main>
<footer><button class="lnk" id="adm">Panel del vendedor</button></footer>
<div class="panel" id="cart"><div class="sheet" id="cs"></div></div>

<script>
const SB_URL="https://smixzckoygcqdxrxshgi.supabase.co";
const SB_KEY="sb_publishable_ioHljZW02KdJxGPhWJ2cIg_xw-59re6";
const PRODUCTS=[
{id:1,n:"Auriculares inalámbricos",c:"Tecnología",p:129000,e:"🎧"},
{id:2,n:"Reloj inteligente",c:"Tecnología",p:189000,e:"⌚"},
{id:3,n:"Luces LED para cuarto",c:"Hogar",p:59000,e:"💡"},
{id:4,n:"Organizador de cocina",c:"Hogar",p:75000,e:"🧺"},
{id:5,n:"Mochila antirrobo",c:"Moda",p:149000,e:"🎒"},
{id:6,n:"Lentes de sol",c:"Moda",p:69000,e:"🕶️"},
{id:7,n:"Masajeador de cuello",c:"Belleza y salud",p:119000,e:"💆"},
{id:8,n:"Plancha alisadora",c:"Belleza y salud",p:139000,e:"💇"},
{id:9,n:"Soporte para celular de auto",c:"Tecnología",p:45000,e:"📱"},
{id:10,n:"Botella térmica",c:"Hogar",p:65000,e:"🧴"}
];
const CATS=["Todo",...new Set(PRODUCTS.map(x=>x.c))];
let cat="Todo",term="",cart={},token=null;
const $=s=>document.querySelector(s);
const gs=v=>"Gs. "+Number(v).toLocaleString("es-PY");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const H=(extra)=>Object.assign({apikey:SB_KEY,"Content-Type":"application/json"},extra||{});
function count(){return Object.values(cart).reduce((a,b)=>a+b,0)}
function badge(){$("#n").textContent=count()}
function drawCats(){$("#cats").innerHTML=CATS.map(c=>`<button class="${c===cat?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}
function drawGrid(){
  const l=PRODUCTS.filter(x=>(cat==="Todo"||x.c===cat)&&x.n.toLowerCase().includes(term));
  $("#empty").style.display=l.length?"none":"block";
  $("#grid").innerHTML=l.map(x=>`<div class="p"><div class="im">${x.e}</div><div class="in"><h3>${x.n}</h3><small>${x.c}</small><div class="pr">${gs(x.p)}</div><button class="add" data-a="${x.id}">Agregar al carrito</button></div></div>`).join("");
}
function drawCart(){
  const ids=Object.keys(cart).filter(k=>cart[k]>0);
  if(!ids.length){$("#cs").innerHTML=`<h2>Tu carrito</h2><p>Todavía no agregaste productos.</p><button class="big" data-x="1">Seguir comprando</button>`;return}
  let t=0;
  const rows=ids.map(k=>{const p=PRODUCTS.find(x=>x.id==k);t+=p.p*cart[k];return `<div class="row"><div>${p.e} ${p.n}<br><small>${gs(p.p)}</small></div><div class="q"><button data-m="${k}" aria-label="Quitar uno">−</button>${cart[k]}<button data-pl="${k}" aria-label="Sumar uno">+</button></div></div>`}).join("");
  $("#cs").innerHTML=`<h2>Tu carrito</h2>${rows}<div class="tot"><span>Total</span><span>${gs(t)}</span></div>
  <h2 style="font-size:17px">Datos de entrega</h2>
  <label>Nombre completo</label><input id="f1" autocomplete="name">
  <label>Teléfono (WhatsApp)</label><input id="f2" type="tel" autocomplete="tel">
  <label>País</label><select id="f3"><option>Paraguay</option><option>Argentina</option><option>Colombia</option><option>Chile</option></select>
  <label>Ciudad</label><input id="f4">
  <label>Dirección y referencia</label><textarea id="f5" rows="2"></textarea>
  <label>Forma de pago</label><select id="f6"><option>Transferencia</option><option>Pago contra entrega</option></select>
  <div id="err" class="err"></div>
  <button class="big" id="go" data-o="${t}">Confirmar pedido</button>
  <button class="lnk" data-x="1">Seguir comprando</button>`;
}
function openSheet(){$("#cart").classList.add("open")}
function closeSheet(){$("#cart").classList.remove("open")}
async function order(t){
  const v=i=>$("#f"+i).value.trim();
  if(!v(1)||!v(2)||!v(4)||!v(5)){$("#err").textContent="Completá nombre, teléfono, ciudad y dirección.";return}
  const items=Object.keys(cart).filter(k=>cart[k]>0).map(k=>{const p=PRODUCTS.find(x=>x.id==k);return {n:p.n,q:cart[k],p:p.p}});
  const body={cliente:v(1),telefono:v(2),pais:$("#f3").value,ciudad:v(4),direccion:v(5),pago:$("#f6").value,items,total:t};
  const b=$("#go");b.disabled=true;b.textContent="Enviando...";
  try{
    const r=await fetch(SB_URL+"/rest/v1/orders",{method:"POST",headers:H({Prefer:"return=minimal"}),body:JSON.stringify(body)});
    if(!r.ok)throw new Error(r.status);
    cart={};badge();
    $("#cs").innerHTML=`<h2 class="ok">¡Pedido recibido!</h2><p>Gracias, ${esc(body.cliente)}. Te escribimos por WhatsApp al ${esc(body.telefono)} para coordinar el pago y la entrega.</p><button class="big" data-x="1">Volver a la tienda</button>`;
  }catch(e){b.disabled=false;b.textContent="Confirmar pedido";$("#err").textContent="No se pudo enviar el pedido. Revisá tu conexión e intentá de nuevo."}
}
function loginView(msg){
  $("#cs").innerHTML=`<h2>Panel del vendedor</h2><label>Email</label><input id="em" type="email" autocomplete="username"><label>Contraseña</label><input id="pw" type="password" autocomplete="current-password"><div class="err">${esc(msg||"")}</div><button class="big" data-login="1">Entrar</button><button class="lnk" data-x="1">Cerrar</button>`;
  openSheet();
}
async function login(){
  const email=$("#em").value.trim(),password=$("#pw").value;
  try{
    const r=await fetch(SB_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:H(),body:JSON.stringify({email,password})});
    const d=await r.json();
    if(!r.ok||!d.access_token){loginView("Email o contraseña incorrectos.");return}
    token=d.access_token;adminView();
  }catch(e){loginView("No se pudo conectar. Intentá de nuevo.")}
}
async function adminView(){
  $("#cs").innerHTML=`<h2>Pedidos</h2><p>Cargando...</p>`;
  try{
    const r=await fetch(SB_URL+"/rest/v1/orders?select=*&order=created_at.desc",{headers:H({Authorization:"Bearer "+token})});
    if(!r.ok)throw new Error(r.status);
    const all=await r.json();
    const ests=["pendiente","cargado en Dropi","enviado","entregado","cancelado"];
    $("#cs").innerHTML=`<h2>Pedidos (${all.length})</h2>`+(all.length?all.map(o=>`<div class="ord"><b>#${o.id}</b> · ${new Date(o.created_at).toLocaleString("es-PY")}<br>${esc(o.cliente)} · ${esc(o.telefono)}<br>${esc(o.ciudad)}, ${esc(o.pais)}<br>${esc(o.direccion)}<br>${(o.items||[]).map(i=>esc(i.q)+"× "+esc(i.n)).join(", ")}<br><b>${gs(o.total)}</b> · ${esc(o.pago)}<br><select data-st="${o.id}">${ests.map(s=>`<option ${s===o.estado?"selected":""}>${s}</option>`).join("")}</select></div>`).join(""):"<p>Todavía no hay pedidos.</p>")+`<button class="big" data-refresh="1">Actualizar</button><button class="lnk" data-x="1">Cerrar</button>`;
  }catch(e){loginView("La sesión venció. Entrá de nuevo.")}
}
async function setEstado(id,estado){
  try{await fetch(SB_URL+"/rest/v1/orders?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:H({Authorization:"Bearer "+token,Prefer:"return=minimal"}),body:JSON.stringify({estado})})}catch(e){}
}
document.addEventListener("click",e=>{
  const d=e.target.dataset||{};
  if(d.c){cat=d.c;drawCats();drawGrid()}
  if(d.a){cart[d.a]=(cart[d.a]||0)+1;badge()}
  if(d.m){cart[d.m]=Math.max(0,cart[d.m]-1);badge();drawCart()}
  if(d.pl){cart[d.pl]++;badge();drawCart()}
  if(d.o)order(+d.o);
  if(d.x)closeSheet();
  if(d.login)login();
  if(d.refresh)adminView();
  if(e.target.id==="bc"){drawCart();openSheet()}
  if(e.target.id==="adm"){token?adminView():loginView();openSheet()}
  if(e.target.id==="cart")closeSheet();
});
document.addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.st)setEstado(e.target.dataset.st,e.target.value)});
$("#q").addEventListener("input",e=>{term=e.target.value.toLowerCase().trim();drawGrid()});
drawCats();drawGrid();badge();
</script>
</body>
</html>
